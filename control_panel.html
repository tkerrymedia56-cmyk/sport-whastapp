<!DOCTYPE html>
<script>
  const DB_URL = "https://tkspoort-default-rtdb.firebaseio.com/links.json";

  // Load the current active link when the page opens
  window.onload = async function() {
    try {
      const response = await fetch(DB_URL);
      const data = await response.json();
      if (data && data.v1) {
        document.getElementById("current-link-display").innerText = data.v1;
      }
    } catch (error) {
      console.error("Error loading link:", error);
    }
  };

  // Save the new link to the cloud when clicking update
  async function updateV1Link() {
    const newLink = document.getElementById("new-link-input").value.trim();
    if (!newLink) {
      alert("Please paste a valid WhatsApp link first!");
      return;
    }

    try {
      await fetch(DB_URL, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ v1: newLink })
      });
      
      document.getElementById("current-link-display").innerText = newLink;
      document.getElementById("new-link-input").value = "";
      alert("V1 Link Updated Live for Everyone!");
    } catch (error) {
      alert("Failed to update link. Check your internet connection.");
    }
  }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to WhatsApp...</title>
  <style>
    body {
      background-color: #111827;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
  </style>
</head>
<body>
  <p id="status">Opening WhatsApp group, please wait...</p>

  <script>
    const DB_URL = "https://tkspoort-default-rtdb.firebaseio.com/links.json";

    async function redirectUser() {
      try {
        const response = await fetch(DB_URL);
        const data = await response.json();

        if (data && data.v1) {
          window.location.replace(data.v1);
        } else {
          document.getElementById("status").innerText = "Group link not set yet. Please update it in the Control Center.";
        }
      } catch (error) {
        document.getElementById("status").innerText = "Connection error. Please refresh.";
      }
    }

    redirectUser();
  </script>
</body>
</html>
